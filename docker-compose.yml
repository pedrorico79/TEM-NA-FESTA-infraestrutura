version: '3.8'

services:
  frontend:
    image: temnafesta/frontend:latest
    ports:
      - "80:80"
    networks:
      - app-network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.camada == frontend
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-som:
    image: temnafesta/backend-som:latest
    networks:
      - app-network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.camada == backend
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://rds-endpoint:3306/temnafesta
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    networks:
      - app-network
    deploy:
      placement:
        constraints:
          - node.labels.camada == backend
      restart_policy:
        condition: on-failure

  notificacoes-worker:
    image: temnafesta/notificacoes:latest
    networks:
      - app-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.camada == backend
      restart_policy:
        condition: on-failure
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DB_PASSWORD=${DB_PASSWORD}

networks:
  app-network:
    driver: overlay
    attachable: true
